# The root stays a real package (not a virtual manifest): `flake.nix` reads
# `package.version` out of this file as the single source of truth for the
# build, and a virtual root has no `[package]` to read.
[workspace]
members = ["crates/agent-spec", "crates/st2-wire"]
default-members = [".", "crates/agent-spec", "crates/st2-wire"]

[package]
name = "st2"
version = "0.1.0"
edition = "2024"
description = "Harness-agnostic runner: reconcile a unified catalog+inbox folder of rendered agent specs, keep their ptys running, and deliver messages by moving inbox files."
license = "MIT"

[[bin]]
name = "st2"
path = "src/main.rs"

[lib]
name = "st2"
path = "src/lib.rs"

[dependencies]
# Sync by design: the runner is I/O-light (shell-outs to `pty` plus a
# folder watch + a sleep), so no tokio. Deps grow per milestone; M0 needs only parse + CLI.
agent-spec = { path = "crates/agent-spec" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
kdl = "6"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
st2-wire = { path = "crates/st2-wire" }
tempfile = "3"
toml = "0.9"
tungstenite = "0.30"

[dev-dependencies]
libc = "0.2"
toml = "0.9"
